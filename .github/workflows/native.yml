name: Native macOS foundation
on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Record toolchain
        run: |
          mkdir -p dist
          { sw_vers; uname -m; xcodebuild -version; swift --version; } | tee dist/toolchain.txt
      - name: Unit and native media tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee dist/swift-tests.log
      - name: Build development application
        run: bash scripts/build-app.sh
      - name: Launch app and check visible controls without capture
        run: |
          python3 - <<'PY'
          import pathlib, subprocess
          subprocess.run(['.build/release/EidosClips', '--ui-smoke', str(pathlib.Path('dist').resolve())], check=True, timeout=20)
          PY
      - name: Decode synthetic normal, paused, trimmed and interrupted recordings
        run: python3 scripts/recovery-probe.py .build/release/clips-probe dist/foundation-evidence.json
      - name: Upload application and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EidosClips-macOS-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
